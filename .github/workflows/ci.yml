# shAnalysis CI - GitHub Actions workflow template (v2.12.0)
#
# INSTALL: copy this file to <repo-root>/.github/workflows/shanalysis-ci.yml
# (workflow files only take effect at the repository root, so from within
# gravfire the shAnalysis subfolder path below applies; for a standalone
# shAnalysis repository set WORKDIR to '.').
#
# Licensing (see README section "Continuous integration"):
#   public repo  - nothing to do: setup-matlab licenses base MATLAB
#                  automatically on GitHub-hosted runners
#   private repo - request a MATLAB batch licensing token (MathWorks
#                  Batch Licensing Pilot form), store it as the GitHub
#                  secret MATLAB_BATCH_TOKEN; the env line below maps it
#   self-hosted  - runs-on is [self-hosted]; MATLAB is expected to
#                  already be installed and on PATH on the runner, so
#                  the Setup MATLAB step is skipped: that action only
#                  supports self-hosted UNIX, not Windows (see its
#                  README, "Required Software on Self-Hosted Runners").
#                  No token needed.
#                  NOTE: do not name the setup action's full id in this
#                  header. testContract/testDocSyncAuditIsWired asserts
#                  the gate appears before that id in the RAW FILE TEXT,
#                  so a mention up here reads as the MATLAB step and
#                  fails the ordering check.
#
# The suite is CI-safe by design: all fetch* tests are offline
# (skip/mirror patterns), fixtures come from the dated tag
# (checkout step below), and no
# toolboxes beyond base MATLAB are required.
#
# v2.7.0 (2026-09-05): matrix target switched from ubuntu-latest to
# self-hosted (repo owner's runner). Set up MATLAB is now conditional
# on matrix.os and skipped for self-hosted; a fast MATLAB-on-PATH probe
# replaces it so a missing/misconfigured install fails clearly instead
# of surfacing as a confusing test-suite error.
#
# v2.7.1 (2026-09-05): 'python3' -> 'python'. The Windows python.org
# installer ships python.exe and py.exe but NO python3.exe, so the old
# spelling cannot resolve on a self-hosted Windows runner; 'python'
# resolves on both Windows and the GitHub-hosted Linux images.
# Verified on the runner: C:\Program Files\Python313\python.exe sits
# on the MACHINE PATH, which is what the runner service inherits.
#
# Step order changed in the same revision: the three static gates and
# the MATLAB probe now run BEFORE the fixture checkout. None of them
# reads a fixture, so putting the 11 MB checkout first only meant that
# a fixture problem masked every other result - which is exactly what
# happened on the first self-hosted run.
##
# v2.8.0 (2026-09-05): trigger cleanup - push restricted to main and a
# concurrency group added, so a commit on a PR branch runs the suite
# once instead of twice.
#
# NOTE for whoever removes the Setup MATLAB step: it is skipped on
# self-hosted but must STAY IN THE FILE. testContract/
# testDocSyncAuditIsWired requires the setup action's id to be present
# and to come after the doc gate; delete the step and the test fails on
# the empty match, not on the ordering.
#
# v2.9.0 (2026-09-05): fixtures pinned to the tag 'fixtures-2026-08'
# instead of the branch 'testdata'. See the checkout step for why.
#
# v2.10.0 (2026-09-05): static gates moved to their own ubuntu-latest
# job, restoring Linux coverage for the doc audits without any MATLAB
# licence. New gate tools/fixture_tag_audit.py.
#
# v2.11.0 (2026-09-05): added tools/toolbox_dependency_audit.py to the
# gates job - base MATLAB only, enforced by reading the source.
#
# v2.12.0 (2026-09-05): added tools/nv_casing_audit.py to the gates job.

# Developed by Matthias Weigelt with the help of Claude (Fable 5),
# 2026-08-08 (v2.6.0); Claude (Sonnet 5), 2026-09-05 (v2.7.0).

name: shAnalysis CI

# push is limited to main. An unrestricted 'push:' alongside
# 'pull_request:' fires BOTH events for every commit on a branch that
# has an open PR, so the whole suite ran twice for the same tree - on a
# single self-hosted runner that is not just waste, the second run
# queues behind the first. Branch commits are now covered once, via
# pull_request; main is covered once, via push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# One run per ref. Pushing twice in quick succession used to leave the
# superseded run occupying the only runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The static gates need no MATLAB and no licence, so they run on a
  # GitHub-hosted Linux image. Two things follow. They give back the
  # Linux coverage lost when the ubuntu-latest matrix leg was dropped -
  # and for a MATLAB toolbox the realistic platform-specific defect is
  # filename case, which Windows forgives and Linux does not. And they
  # report in seconds without occupying the single self-hosted runner,
  # which is the fast feedback the old in-job ordering was reaching for.
  #
  # Deliberately NOT duplicated on the self-hosted leg: running them on
  # Windows as well adds no signal that the Linux run does not already
  # give, and would only make the two jobs' results ambiguous.
  gates:
    name: gates (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Documentation completeness audit
        run: python3 tools/help_audit.py

      - name: Documentation sync audit (help vs html vs guide)
        run: python3 tools/doc_sync_audit.py

      - name: No map renderer (geoMap is the single cartographic authority)
        run: python3 tools/dev/no_map_renderer.py

      # Guards the failure mode the tag arrangement introduced in
      # v2.9.0: publish a newer fixtures-* tag, forget to bump 'ref:'
      # below, and CI keeps passing against stale data. Needs the
      # checkout's persisted credentials for git ls-remote.
      # Restores the guarantee that used to hold by construction: the
      # old GitHub-hosted leg ran on base MATLAB, so an accidental
      # add-on dependency failed at once. A8 carries Parallel Computing
      # Toolbox, so that guard vanished with the matrix change. This
      # gate reads the source instead of the environment.
      - name: Base MATLAB only (no add-on toolboxes)
        run: python3 tools/toolbox_dependency_audit.py

      # Two NV names differing only by case compile and run in MATLAB
      # with no warning, leaving one unreachable. The casing sweep is
      # precisely the operation that can create such a pair, so this
      # runs BEFORE the sweep, not after.
      - name: Name-Value casing
        run: python3 tools/nv_casing_audit.py

      - name: Fixture tag currency
        run: python3 tools/fixture_tag_audit.py

  test:
    name: runAllTests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [self-hosted]
    runs-on: ${{ matrix.os }}
    # The whole job normally finishes in about three minutes. A cap well
    # above that turns a hung step into a fast, visible failure instead
    # of a run that sits pending until somebody notices: the MathWorks
    # 'Set up MATLAB' step hung four times in one session, taking 5-10
    # minutes against its usual 1.2 before being cancelled by hand.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        # Only for GitHub-hosted matrix legs. setup-matlab does not
        # support self-hosted Windows runners (self-hosted UNIX only);
        # on self-hosted, MATLAB must already be installed and on PATH.
        if: ${{ matrix.os != 'self-hosted' }}
        # this is the step that hangs; cap it tightly so a retry costs
        # eight minutes rather than the whole job budget
        timeout-minutes: 8
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
          cache: true

      - name: Verify MATLAB on PATH (self-hosted)
        # Fails fast with an unambiguous message if the self-hosted
        # runner's MATLAB installation is missing/not on PATH, instead
        # of that surfacing as a cryptic failure in "Run test suite".
        if: ${{ matrix.os == 'self-hosted' }}
        timeout-minutes: 2
        uses: matlab-actions/run-command@v3
        with:
          command: >
            fprintf('MATLAB on self-hosted runner: %s\n', version);

      # Fixtures live outside main (v3.26.1) so main need not carry the
      # 11 MB. They are pinned to a dated TAG, not a branch: a tag makes
      # this main revision resolve to one exact data set forever, which a
      # moving branch could never show, and it does not trigger GitHub's
      # "compare & pull request" banner on every fixture update - a
      # prompt to open a PR that has no common ancestor and can never be
      # merged. actions/checkout resolves ref against refs/tags as well
      # as refs/heads, so nothing else about the step changes.
      #
      # To update fixtures: new commit, new tag 'fixtures-YYYY-MM', bump
      # the ref below in the same PR. Never move an existing tag.
      #
      # Development machines do not use this at all - they resolve via
      # SHX_TESTDATA_FOLDER or the TestDataFolder preference
      # (shLowLevel.testDataDir).
      - name: Check out test fixtures (tag)
        uses: actions/checkout@v6
        with:
          ref: fixtures-2026-08
          path: tests/test_data

      - name: Run test suite
        uses: matlab-actions/run-command@v3
        with:
          command: >
            fprintf('pwd: %s\n', pwd);
            assert(isfolder('+shLowLevel'), 'repo layout: +shLowLevel missing in %s', pwd);
            assert(isfolder('tests'), 'repo layout: tests missing in %s', pwd);
            d = dir(fullfile('+shLowLevel', '*.m'));
            fprintf('files in +shLowLevel: %d\n', numel(d));
            assert(numel(d) >= 80, 'repo layout: only %d files in +shLowLevel', numel(d));
            addpath(pwd);
            fprintf('shLowLevel.legendreCached resolves to: %s\n', ...
                which('shLowLevel.legendreCached'));
            results = runtests('tests', IncludeSubfolders = false);
            disp(table(results));
            assertSuccess(results);

      - name: Archive test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: tests/perf_log.csv
          if-no-files-found: ignore
