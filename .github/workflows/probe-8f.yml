# THROWAWAY (WP8 8f, 2026-10-24): which GFZ hosts can A8 reach?
# Not meant to be merged.
name: probe-8f
on:
  pull_request:
    paths: [".github/workflows/probe-8f.yml"]
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: TCP 443 to GFZ and other data hosts
        shell: powershell
        run: |
          foreach ($h in @('isdc-data.gfz.de', 'isdc.gfz.de', 'icgem.gfz-potsdam.de', 'icgem.gfz.de', 'esmdata.gfz.de', 'gravis.gfz.de', 'www.gfz.de', 'isdcftp.gfz.de', 'ftp.tugraz.at', 'github.com')) {
            $r = Test-NetConnection $h -Port 443 -WarningAction SilentlyContinue
            "{0,-24} {1,-16} tcp443={2}" -f $h, $r.RemoteAddress, $r.TcpTestSucceeded
          }
          $r = Test-NetConnection 'isdcftp.gfz.de' -Port 21 -WarningAction SilentlyContinue
          "isdcftp.gfz.de ftp21={0}" -f $r.TcpTestSucceeded
          & tracert.exe -d -h 12 -w 800 139.17.228.112
