# THROWAWAY (WP8 8f, 2026-10-24): can A8 reach the ESA ESM host at all?
# Downloads nothing beyond directory listings. Not meant to be merged.
name: probe-8f
on:
  pull_request:
    paths: [".github/workflows/probe-8f.yml"]
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Reach isdc-data.gfz.de
        shell: powershell
        run: |
          $h = 'isdc-data.gfz.de'
          try { Resolve-DnsName $h | Format-Table Name, Type, IPAddress -AutoSize } catch { "DNS FAILED: $($_.Exception.Message)" }
          try { Test-NetConnection $h -Port 443 | Format-List ComputerName, RemoteAddress, TcpTestSucceeded } catch { "TNC FAILED" }
          try { Test-NetConnection $h -Port 80 | Format-List ComputerName, RemoteAddress, TcpTestSucceeded } catch { "TNC FAILED" }
          "proxy env: HTTPS_PROXY=$env:HTTPS_PROXY HTTP_PROXY=$env:HTTP_PROXY"
          netsh winhttp show proxy
      - name: curl listings
        shell: powershell
        run: |
          foreach ($d in @('mtmshc/', 'mtmdeal/')) {
            foreach ($s in @('https', 'http')) {
              $u = "${s}://isdc-data.gfz.de/future_missions/esaesm/ESAESM2/$d"
              "===== $u"
              & curl.exe -sS -m 60 -4 $u 2>&1 | ForEach-Object { ($_ -replace '<[^>]+>', ' ').Trim() } | Where-Object { $_ -ne '' } | Select-Object -First 60
            }
          }
